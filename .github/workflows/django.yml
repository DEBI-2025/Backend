name: Django CI

on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: 3.13
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv 
        pipenv  requirements >>  requirements.txt
        pip install -r requirements.txt

    # - name: Run Tests
    #   run: |
    #     cd innerview
    #     python manage.py test
    #   env:
    #     api_key: ${{secrets.API_KEY}}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name : add .env file
      run : |
        touch innerview/.env 
        echo super_user_pass="${super_user_pass}" >>  innerview/.env 
        echo super_user_email="${super_user_email}" >>  innerview/.env 
      env:
        super_user_email: ${{vars.SUPER_USER_EMAIL}} 
        super_user_pass: ${{secrets.SUPER_USER_PASS}}

    - name: cat .env file
      run : |
        cat innerview/.env 

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: innerview-backend:latest
        build-args: |
          super_user_email=${{vars.SUPER_USER_EMAIL}} 
          super_user_pass=${{secrets.SUPER_USER_PASS}}
  

